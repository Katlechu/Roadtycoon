<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Road Tycoon">
<meta name="format-detection" content="telephone=no">
<title>Road Tycoon</title>
<style>
*{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#4a8c3a;overflow:hidden;position:fixed;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
#hud{z-index:5;position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 12px) 6px calc(env(safe-area-inset-left) + 12px);background:rgba(0,0,0,.55);color:#fff;font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#warn{z-index:5;position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 46px);background:#c0392b;color:#fff;padding:6px 12px;border-radius:8px;font-size:14px;display:none;pointer-events:none}
.pedal{z-index:5;position:fixed;width:84px;height:84px;border-radius:50%;color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;border:3px solid rgba(255,255,255,.7);background:rgba(0,0,0,.35);touch-action:none}
.pedal.on{background:rgba(255,255,255,.5);color:#000}
#gas{right:calc(env(safe-area-inset-right) + 18px);bottom:calc(env(safe-area-inset-bottom) + 24px);width:100px;height:100px;background:rgba(46,204,113,.45)}
#brake{right:calc(env(safe-area-inset-right) + 130px);bottom:calc(env(safe-area-inset-bottom) + 24px);background:rgba(231,76,60,.45)}
#hint{z-index:5;position:fixed;left:calc(env(safe-area-inset-left) + 20px);bottom:calc(env(safe-area-inset-bottom) + 50px);color:rgba(255,255,255,.85);font-size:14px;pointer-events:none;text-shadow:0 1px 3px #000}
.ov{z-index:100;position:fixed;inset:0;background:rgba(0,0,0,.9);color:#fff;display:none;flex-direction:column;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 14px)}
.ov h2{margin:6px 0}
.card{background:#333;border-radius:12px;padding:10px 12px;margin:5px;width:min(420px,92vw);display:flex;justify-content:space-between;align-items:center;gap:10px}
button{cursor:pointer;font-size:18px;min-height:48px;min-width:96px;padding:10px 16px;margin:6px;border:0;border-radius:10px;background:#f5a623;color:#000;font-weight:700;touch-action:manipulation}
button:disabled{background:#666;color:#999}
#start{z-index:200;display:flex;text-align:center;padding-top:calc(env(safe-area-inset-top) + 40px)}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="hMoney"></span><span id="hEn"></span><span id="hDay"></span><span id="hCar"></span></div>
<div id="warn">Erschöpft! Im Hotel übernachten.</div>
<div id="hint">◀ ▶ Links wischen = Lenken</div>
<div class="pedal" id="brake">BREMSE</div>
<div class="pedal" id="gas">GAS</div>
<div class="ov" id="start"><h1>🚗 Road Tycoon</h1>
<p style="max-width:380px;line-height:1.5">Links wischen = lenken.<br>GAS/BREMSE rechts unten.<br>Fahre zu den blauen Punkten, verdiene Geld, kaufe Autos im Autohaus und schlafe im Hotel.</p>
<button id="startBtn">Spiel starten</button></div>
<div class="ov" id="shop"><h2>🚗 Autohaus</h2><div id="shopList"></div><button id="shopClose">Schließen</button></div>
<div class="ov" id="hotel"><h2>🏨 Hotel</h2><p id="hotelTxt"></p><button id="sleepBtn">Übernachten (80 €)</button><button id="hotelClose">Schließen</button></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let VW=innerWidth,VH=innerHeight,DPR=1;
function rs(){DPR=Math.min(window.devicePixelRatio||1,3);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR}
rs();addEventListener('resize',rs);addEventListener('orientationchange',()=>setTimeout(rs,200));
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{const t=e.target;if(!(t&&t.closest&&t.closest('.ov')))e.preventDefault()},{passive:false});
// Tap-Helfer: funktioniert mit Touch, Maus und Stift, nur einmal pro Tap
function tap(el,fn){let t=0;const h=e=>{const n=Date.now();if(n-t<400)return;t=n;if(e.cancelable)e.preventDefault();fn()};
 el.addEventListener('pointerup',h);el.addEventListener('touchend',h,{passive:false});el.addEventListener('click',h)}

const CARS=[{n:'Kleinwagen',p:0,sp:3.2,c:'#e74c3c'},{n:'Kombi',p:800,sp:4.2,c:'#3498db'},{n:'Sportwagen',p:3000,sp:5.8,c:'#f1c40f'},{n:'Rennwagen',p:9000,sp:7.5,c:'#9b59b6'}];
const def={money:0,owned:[0],cur:0,energy:100,day:1};
let S;try{S=JSON.parse(localStorage.getItem('rt')||'null')||def}catch(e){S=def}
function save(){try{localStorage.setItem('rt',JSON.stringify(S))}catch(e){}}
const W=3000,H=3000;
const car={x:1500,y:1650,a:-Math.PI/2,v:0};
const shopB={x:1200,y:1200,w:160,h:120,c:'#2ecc71',t:'AUTOHAUS'};
const hotelB={x:1800,y:1200,w:160,h:120,c:'#e67e22',t:'HOTEL'};
function newJob(){let x,y;do{x=200+Math.random()*(W-400);y=200+Math.random()*(H-400)}while(Math.hypot(x-car.x,y-car.y)<500);
 return{x,y,r:34,pay:Math.round(30+Math.hypot(x-car.x,y-car.y)/10)}}
let job=newJob();
const trees=[];for(let i=0;i<150;i++){const x=Math.random()*W,y=Math.random()*H;if(!(Math.abs(x-1500)<700&&Math.abs(y-1300)<400))trees.push({x,y})}

const st={steer:0,gas:false,brake:false};
let stick={id:null,sx:0,sy:0,dx:0};
cv.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches){if(stick.id===null&&t.clientX<VW*0.6){stick={id:t.identifier,sx:t.clientX,sy:t.clientY,dx:0};$('hint').style.display='none'}}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===stick.id){stick.dx=Math.max(-1,Math.min(1,(t.clientX-stick.sx)/55))}},{passive:false});
function endT(e){for(const t of e.changedTouches)if(t.identifier===stick.id)stick={id:null,sx:0,sy:0,dx:0}}
cv.addEventListener('touchend',endT);cv.addEventListener('touchcancel',endT);
function pedal(id,key){const el=$(id);const ids=new Set();
 const upd=()=>{st[key]=ids.size>0;el.classList.toggle('on',st[key])};
 el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();for(const t of e.changedTouches)ids.add(t.identifier);upd()},{passive:false});
 const off=e=>{e.preventDefault();for(const t of e.changedTouches)ids.delete(t.identifier);upd()};
 el.addEventListener('touchend',off,{passive:false});el.addEventListener('touchcancel',off,{passive:false});
 el.addEventListener('mousedown',()=>{ids.add('m');upd()});addEventListener('mouseup',()=>{ids.delete('m');upd()})}
pedal('gas','gas');pedal('brake','brake');
const keys={};addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);

let open=true;
tap($('startBtn'),()=>{$('start').style.display='none';open=false});
function closeOv(){$('shop').style.display='none';$('hotel').style.display='none';open=false;car.v=0;cool=120}
tap($('shopClose'),closeOv);tap($('hotelClose'),closeOv);
function openShop(){open=true;const l=$('shopList');l.innerHTML='';
 const h=document.createElement('div');h.style.margin='5px';h.textContent='Geld: '+Math.floor(S.money)+' €';l.appendChild(h);
 CARS.forEach((c,i)=>{const d=document.createElement('div');d.className='card';const own=S.owned.includes(i);
 d.innerHTML=`<span><b>${c.n}</b><br>Tempo ${c.sp} · ${own?'gekauft':c.p+' €'}</span>`;const b=document.createElement('button');
 b.textContent=S.cur===i?'Aktiv':own?'Fahren':'Kaufen';b.disabled=S.cur===i||(!own&&S.money<c.p);
 tap(b,()=>{if(b.disabled)return;if(!own){S.money-=c.p;S.owned.push(i)}S.cur=i;save();openShop()});d.appendChild(b);l.appendChild(d)});
 $('shop').style.display='flex'}
function openHotel(){open=true;$('hotelTxt').textContent=`Tag ${S.day} · Energie ${Math.round(S.energy)}% · Geld ${Math.floor(S.money)} €`;
 $('sleepBtn').disabled=S.money<80;$('hotel').style.display='flex'}
tap($('sleepBtn'),()=>{if(S.money>=80){S.money-=80;S.energy=100;S.day++;save();openHotel()}});
function inB(b,m=0){return car.x>b.x-m&&car.x<b.x+b.w+m&&car.y>b.y-m&&car.y<b.y+b.h+m}
let cool=0,last=performance.now();
function loop(t){const dt=Math.min(2.5,(t-last)/16.67);last=t;update(dt);draw();hud();requestAnimationFrame(loop)}
function update(dt){if(open)return;
 let steer=stick.dx;if(keys.ArrowLeft)steer=-1;if(keys.ArrowRight)steer=1;
 const gas=st.gas||keys.ArrowUp,br=st.brake||keys.ArrowDown;
 const mx=CARS[S.cur].sp*(S.energy<=0?.4:1);
 if(gas&&!br)car.v+=(mx-car.v)*.03*dt;
 else if(br){car.v-=.12*dt;if(car.v<-mx*.4)car.v=-mx*.4}
 else car.v*=Math.pow(.985,dt);
 if(Math.abs(car.v)<.02&&!gas&&!br)car.v=0;
 car.a+=steer*.06*Math.max(-1,Math.min(1,car.v/2.5))*dt;
 let nx=car.x+Math.cos(car.a)*car.v*dt,ny=car.y+Math.sin(car.a)*car.v*dt;
 nx=Math.max(20,Math.min(W-20,nx));ny=Math.max(20,Math.min(H-20,ny));
 for(const b of [shopB,hotelB]){if(nx>b.x-12&&nx<b.x+b.w+12&&ny>b.y-12&&ny<b.y+b.h+12){nx=car.x;ny=car.y;car.v*=.3}}
 car.x=nx;car.y=ny;S.energy=Math.max(0,S.energy-Math.abs(car.v)*.0015*dt);
 if(Math.hypot(car.x-job.x,car.y-job.y)<job.r+16){S.money+=job.pay;save();job=newJob()}
 cool-=dt;if(cool<=0){if(inB(shopB,45)){cool=120;car.v=0;openShop()}else if(inB(hotelB,45)){cool=120;car.v=0;openHotel()}}
}
function box(b){ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#000';ctx.fillRect(b.x+b.w/2-12,b.y+b.h-40,24,40);ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText(b.t,b.x+b.w/2,b.y+25)}
function hud(){$('hMoney').textContent='💰 '+Math.floor(S.money)+' €';$('hEn').textContent='⚡ '+Math.round(S.energy)+'%';$('hDay').textContent='Tag '+S.day;$('hCar').textContent=CARS[S.cur].n;$('warn').style.display=S.energy<=0?'block':'none'}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);const cx=car.x-VW/2,cy=car.y-VH/2;ctx.fillStyle='#4a8c3a';ctx.fillRect(0,0,VW,VH);
 ctx.save();ctx.translate(-cx,-cy);
 ctx.fillStyle='#555';ctx.fillRect(0,1450,W,100);ctx.fillRect(1450,0,100,H);ctx.fillRect(1150,1150,800,60);
 ctx.strokeStyle='#ff0';ctx.setLineDash([30,30]);ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,1500);ctx.lineTo(W,1500);ctx.moveTo(1500,0);ctx.lineTo(1500,H);ctx.stroke();ctx.setLineDash([]);
 ctx.strokeStyle='#000';ctx.lineWidth=6;ctx.strokeRect(0,0,W,H);
 for(const t of trees){ctx.fillStyle='#1e5c1e';ctx.beginPath();ctx.arc(t.x,t.y,18,0,7);ctx.fill()}
 box(shopB);box(hotelB);
 ctx.fillStyle='#00e5ff';ctx.beginPath();ctx.arc(job.x,job.y,job.r,0,7);ctx.fill();ctx.fillStyle='#000';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText(job.pay+'€',job.x,job.y+5);
 ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.a);ctx.fillStyle=CARS[S.cur].c;ctx.fillRect(-22,-12,44,24);ctx.fillStyle='#9ad';ctx.fillRect(3,-9,11,18);ctx.fillStyle='#ff9';ctx.fillRect(20,-10,3,6);ctx.fillRect(20,4,3,6);ctx.restore();
 ctx.restore();
 const a=Math.atan2(job.y-car.y,job.x-car.x);ctx.save();ctx.translate(VW/2,VH/2);ctx.rotate(a);ctx.fillStyle='#00e5ff';ctx.beginPath();ctx.moveTo(80,0);ctx.lineTo(58,-9);ctx.lineTo(58,9);ctx.fill();ctx.restore();
 if(stick.id!==null){ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(stick.sx,stick.sy,55,0,7);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(stick.sx+stick.dx*55,stick.sy,24,0,7);ctx.fill()}
}
requestAnimationFrame(loop);
</script></body></html>
